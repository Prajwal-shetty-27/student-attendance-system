<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Access Denied</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .container {

            background: white;

            padding: 40px;

            border-radius: 12px;

            text-align: center;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);

            width: 400px;
        }

        h1 {

            color: #d32f2f;

            margin-bottom: 15px;
        }

        p {

            color: #555;

            margin-bottom: 25px;
        }

        a {

            display: inline-block;

            padding: 10px 20px;

            background: #1976d2;

            color: white;

            text-decoration: none;

            border-radius: 6px;
        }

        a:hover {

            background: #125aa0;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>Access Denied</h1>

        <p>
            You do not have permission to access this page.
        </p>

        <a href="/login/">
            Back to Login
        </a>

    </div>

</body>

</html>
