<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delete Class</title>


    <style>

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background-color: #f4f6f8;
        }


        .header {

            background-color: #2c3e50;

            color: white;

            padding: 20px 40px;
        }


        .header h1 {

            margin: 0;
        }


        .container {

            max-width: 500px;

            margin: 80px auto;
        }


        .card {

            background-color: white;

            padding: 30px;

            border-radius: 10px;

            text-align: center;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.1);
        }


        .warning {

            color: #e74c3c;

            font-size: 18px;

            font-weight: bold;
        }


        .class-name {

            font-size: 20px;

            color: #2c3e50;

            margin: 20px 0;
        }


        .buttons {

            margin-top: 25px;

            display: flex;

            justify-content: center;

            gap: 10px;
        }


        .delete-btn {

            background-color: #e74c3c;

            color: white;

            border: none;

            padding: 11px 20px;

            border-radius: 5px;

            cursor: pointer;

            font-size: 14px;
        }


        .delete-btn:hover {

            background-color: #c0392b;
        }


        .cancel-btn {

            background-color: #7f8c8d;

            color: white;

            text-decoration: none;

            padding: 11px 20px;

            border-radius: 5px;

            font-size: 14px;
        }


        .cancel-btn:hover {

            background-color: #6c7778;
        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <div class="header">

        <h1>
            Delete Class
        </h1>

    </div>


    <!-- CONTENT -->

    <div class="container">

        <div class="card">


            <p class="warning">

                Are you sure you want to
                delete this class?

            </p>


            <div class="class-name">

                {{ classroom.name }}

            </div>


            <p>

                This action cannot be undone.

            </p>


            <form method="POST">

                {% csrf_token %}


                <div class="buttons">


                    <button
                        type="submit"
                        class="delete-btn"
                    >

                        Yes, Delete

                    </button>


                    <a
                        href="/classes/"
                        class="cancel-btn"
                    >

                        Cancel

                    </a>


                </div>

            </form>


        </div>

    </div>


</body>

</html>
