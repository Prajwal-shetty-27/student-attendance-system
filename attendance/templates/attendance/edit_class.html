<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Class</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #2c3e50;
            color: white;

            padding: 20px 40px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            max-width: 600px;

            margin: 50px auto;
        }

        .card {
            background-color: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;

            font-weight: bold;

            margin-bottom: 8px;
        }

        input {
            width: 100%;

            box-sizing: border-box;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 15px;

            margin-bottom: 20px;
        }

        .buttons {
            display: flex;

            gap: 10px;
        }

        .save-btn {
            background-color: #27ae60;

            color: white;

            border: none;

            padding: 11px 20px;

            border-radius: 5px;

            cursor: pointer;

            font-size: 14px;
        }

        .save-btn:hover {
            background-color: #219150;
        }

        .cancel-btn {
            background-color: #7f8c8d;

            color: white;

            text-decoration: none;

            padding: 11px 20px;

            border-radius: 5px;

            font-size: 14px;
        }

        .cancel-btn:hover {
            background-color: #6c7778;
        }

    </style>

</head>


<body>


    <div class="header">

        <h1>
            Edit Class
        </h1>

    </div>


    <div class="container">

        <div class="card">

            <form method="POST">

                {% csrf_token %}


                <label>
                    Class Name
                </label>

                {{ form.name }}


                <div class="buttons">

                    <button
                        type="submit"
                        class="save-btn"
                    >
                        Update Class
                    </button>


                    <a
                        href="/classes/"
                        class="cancel-btn"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>


</body>

</html>
