<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Teacher</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        /* HEADER */

        .header {
            background-color: #2c3e50;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        /* CONTAINER */

        .container {
            max-width: 600px;
            margin: 50px auto;
        }

        /* CARD */

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.1);
        }

        /* FORM */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        input {
            width: 100%;
            box-sizing: border-box;

            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 5px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #3498db;
        }

        /* BUTTONS */

        .buttons {
            display: flex;
            gap: 10px;

            margin-top: 25px;
        }

        .save-btn {
            background-color: #27ae60;
            color: white;

            border: none;

            padding: 11px 20px;
            border-radius: 5px;

            cursor: pointer;

            font-size: 14px;
        }

        .save-btn:hover {
            background-color: #219150;
        }

        .cancel-btn {
            background-color: #7f8c8d;
            color: white;

            text-decoration: none;

            padding: 11px 20px;
            border-radius: 5px;

            font-size: 14px;
        }

        .cancel-btn:hover {
            background-color: #6c7778;
        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <div class="header">

        <h1>
            Add Teacher
        </h1>

    </div>


    <!-- CONTENT -->

    <div class="container">

        <div class="card">

            <form method="POST">

                {% csrf_token %}

                <!-- USERNAME -->

                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <!-- FIRST NAME -->

                <div class="form-group">

                    <label>
                        First Name
                    </label>

                    <input
                        type="text"
                        name="first_name"
                        placeholder="Enter first name"
                    >

                </div>


                <!-- LAST NAME -->

                <div class="form-group">

                    <label>
                        Last Name
                    </label>

                    <input
                        type="text"
                        name="last_name"
                        placeholder="Enter last name"
                    >

                </div>


                <!-- BUTTONS -->

                <div class="buttons">

                    <button
                        type="submit"
                        class="save-btn"
                    >
                        Add Teacher
                    </button>

                    <a
                        href="/teachers/"
                        class="cancel-btn"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
