
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Login | Student Attendance</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #eef4ff;

        }

        .login-container {

            width: 100%;

            max-width: 420px;

            padding: 20px;

        }

        .login-card {

            background: white;

            padding: 40px 35px;

            border-radius: 14px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.10);

        }

        .logo {

            text-align: center;

            margin-bottom: 30px;

        }

        .logo h1 {

            color: #1e3a8a;

            font-size: 28px;

            margin-bottom: 7px;

        }

        .logo p {

            color: #64748b;

            font-size: 14px;

        }

        .login-title {

            text-align: center;

            color: #1e293b;

            font-size: 22px;

            margin-bottom: 25px;

        }

        .form-group {

            margin-bottom: 20px;

        }

        .form-group label {

            display: block;

            margin-bottom: 7px;

            color: #334155;

            font-size: 14px;

            font-weight: 600;

        }

        .form-group input {

            width: 100%;

            padding: 12px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;

        }

        .form-group input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.10);

        }

        .login-button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;

        }

        .login-button:hover {

            background: #1d4ed8;

        }

        .error-message {

            background: #fee2e2;

            color: #b91c1c;

            padding: 11px 13px;

            border-radius: 7px;

            margin-bottom: 20px;

            font-size: 14px;

            text-align: center;

        }

        .footer {

            text-align: center;

            margin-top: 25px;

            color: #94a3b8;

            font-size: 12px;

        }

        @media (max-width: 480px) {

            .login-card {

                padding: 30px 22px;

            }

            .logo h1 {

                font-size: 24px;

            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <div class="logo">

            <h1>Student Attendance</h1>

            <p>Attendance Management System</p>

        </div>


        <h2 class="login-title">

            Teacher Login

        </h2>


        {% if error %}

            <div class="error-message">

                {{ error }}

            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label for="username">

                    Username

                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">

                    Password

                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >

                Login

            </button>

        </form>


        <div class="footer">

            Student Attendance Management System

        </div>


    </div>


</div>


</body>

</html>
