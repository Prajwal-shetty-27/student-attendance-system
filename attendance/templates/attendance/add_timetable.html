<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Timetable</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        /* ERROR MESSAGE */

        .error {
            background: #ffe5e5;
            color: #d00000;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* FORM GROUP */

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        select,
        input {
            display: block;
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
            background: white;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #007bff;
        }

        /* BUTTON */

        button {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        /* BACK LINK */

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            text-decoration: none;
            color: #555;
        }

        .back:hover {
            color: #007bff;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>
            Add Timetable
        </h1>


        <!-- ERROR MESSAGE -->

        {% if error %}

            <div class="error">

                {{ error }}

            </div>

        {% endif %}


        <!-- FORM -->

        <form method="POST">

            {% csrf_token %}


            <!-- CLASS -->

            <div class="form-group">

                <label for="classroom">
                    Class
                </label>

                <select
                    name="classroom"
                    id="classroom"
                    required
                >

                    <option value="">
                        Select Class
                    </option>

                    {% for classroom in classrooms %}

                        <option value="{{ classroom.id }}">

                            {{ classroom.name }}

                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- TEACHER -->

            <div class="form-group">

                <label for="teacher">
                    Teacher
                </label>

                <select
                    name="teacher"
                    id="teacher"
                    required
                >

                    <option value="">
                        Select Teacher
                    </option>

                    {% for teacher in teachers %}

                        <option value="{{ teacher.id }}">

                            {{ teacher.username }}

                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- SUBJECT -->

            <div class="form-group">

                <label for="subject">
                    Subject
                </label>

                <input
                    type="text"
                    name="subject"
                    id="subject"
                    placeholder="Enter subject"
                    required
                >

            </div>


            <!-- DAY -->

            <div class="form-group">

                <label for="day">
                    Day
                </label>

                <select
                    name="day"
                    id="day"
                    required
                >

                    <option value="">
                        Select Day
                    </option>

                    <option value="Monday">
                        Monday
                    </option>

                    <option value="Tuesday">
                        Tuesday
                    </option>

                    <option value="Wednesday">
                        Wednesday
                    </option>

                    <option value="Thursday">
                        Thursday
                    </option>

                    <option value="Friday">
                        Friday
                    </option>

                    <option value="Saturday">
                        Saturday
                    </option>

                </select>

            </div>


            <!-- START TIME -->

            <div class="form-group">

                <label for="start_time">
                    Start Time
                </label>

                <input
                    type="time"
                    name="start_time"
                    id="start_time"
                    required
                >

            </div>


            <!-- END TIME -->

            <div class="form-group">

                <label for="end_time">
                    End Time
                </label>

                <input
                    type="time"
                    name="end_time"
                    id="end_time"
                    required
                >

            </div>


            <!-- SUBMIT BUTTON -->

            <button type="submit">
                Add Timetable
            </button>

        </form>


        <!-- BACK -->

        <a
            href="/timetables/"
            class="back"
        >
            ← Back to Timetable
        </a>

    </div>

</body>

</html>
